<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detailed Quiz Review - E Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 10%, #1a1c29 0%, #0d0e15 100%);
            color: #f8f9fa;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .review-container {
            max-width: 850px;
            margin: 40px auto;
        }
        .review-card {
            background: rgba(30, 32, 47, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .option-item {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: rgba(18, 20, 32, 0.7);
            border: 1px solid #4a5568;
        }
        .option-correct {
            background: rgba(72, 187, 120, 0.2) !important;
            border-color: #48bb78 !important;
            color: #9ae6b4;
            font-weight: 600;
        }
        .option-wrong {
            background: rgba(245, 101, 101, 0.2) !important;
            border-color: #f56565 !important;
            color: #feb2b2;
        }
    </style>
</head>
<body>

    <div class="container review-container">
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-dark rounded border border-secondary">
            <div>
                <h3 class="text-warning fw-bold mb-0"><i class="fas fa-search me-2"></i> Detailed Assessment Review</h3>
                <small class="text-muted">Subject: [[${subject}]]</small>
            </div>
            <div>
                <a th:href="@{/result}" class="btn btn-outline-light btn-sm rounded-pill me-2">
                    <i class="fas fa-arrow-left me-1"></i> Back to Result
                </a>
                <a th:href="@{/}" class="btn btn-warning btn-sm rounded-pill fw-bold text-dark">
                    <i class="fas fa-home me-1"></i> Home
                </a>
            </div>
        </div>

        <div th:each="q, iterStat : ${questions}" 
             th:with="userAns=${userAnswers['q_' + iterStat.index]}"
             class="review-card">
            
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h5 class="text-light mb-0">
                    <span class="text-warning fw-bold" th:text="'Q' + (${iterStat.index} + 1) + '. '"></span>
                    <span th:text="${q.questionText}">Question text</span>
                </h5>
                
                <!-- Status Badge -->
                <span th:if="${userAns != null and userAns == q.correctAnswer}" class="badge bg-success px-3 py-2 rounded-pill">
                    <i class="fas fa-check-circle me-1"></i> Correct
                </span>
                <span th:if="${userAns != null and userAns != q.correctAnswer}" class="badge bg-danger px-3 py-2 rounded-pill">
                    <i class="fas fa-times-circle me-1"></i> Incorrect
                </span>
                <span th:if="${userAns == null}" class="badge bg-secondary px-3 py-2 rounded-pill">
                    <i class="fas fa-minus-circle me-1"></i> Unattempted
                </span>
            </div>

            <!-- Options List -->
            <div class="mt-3">
                <!-- Option 1 -->
                <div class="option-item"
                     th:classappend="${q.option1 == q.correctAnswer} ? 'option-correct' : (${userAns == q.option1} ? 'option-wrong' : '')">
                    <span th:text="${q.option1}">Option 1</span>
                    <span th:if="${q.option1 == q.correctAnswer}" class="float-end badge bg-success">Correct Answer</span>
                    <span th:if="${userAns == q.option1 and q.option1 != q.correctAnswer}" class="float-end badge bg-danger">Your Choice</span>
                </div>

                <!-- Option 2 -->
                <div class="option-item"
                     th:classappend="${q.option2 == q.correctAnswer} ? 'option-correct' : (${userAns == q.option2} ? 'option-wrong' : '')">
                    <span th:text="${q.option2}">Option 2</span>
                    <span th:if="${q.option2 == q.correctAnswer}" class="float-end badge bg-success">Correct Answer</span>
                    <span th:if="${userAns == q.option2 and q.option2 != q.correctAnswer}" class="float-end badge bg-danger">Your Choice</span>
                </div>

                <!-- Option 3 -->
                <div class="option-item" th:if="${q.option3 != null and q.option3 != ''}"
                     th:classappend="${q.option3 == q.correctAnswer} ? 'option-correct' : (${userAns == q.option3} ? 'option-wrong' : '')">
                    <span th:text="${q.option3}">Option 3</span>
                    <span th:if="${q.option3 == q.correctAnswer}" class="float-end badge bg-success">Correct Answer</span>
                    <span th:if="${userAns == q.option3 and q.option3 != q.correctAnswer}" class="float-end badge bg-danger">Your Choice</span>
                </div>

                <!-- Option 4 -->
                <div class="option-item" th:if="${q.option4 != null and q.option4 != ''}"
                     th:classappend="${q.option4 == q.correctAnswer} ? 'option-correct' : (${userAns == q.option4} ? 'option-wrong' : '')">
                    <span th:text="${q.option4}">Option 4</span>
                    <span th:if="${q.option4 == q.correctAnswer}" class="float-end badge bg-success">Correct Answer</span>
                    <span th:if="${userAns == q.option4 and q.option4 != q.correctAnswer}" class="float-end badge bg-danger">Your Choice</span>
                </div>
            </div>

            <div class="mt-2 pt-2 border-top border-secondary small text-muted">
                <span>Your Answer: <strong class="text-light" th:text="${userAns != null ? userAns : 'Not Attempted'}"></strong></span>
                <span class="mx-2">|</span>
                <span>Correct Answer: <strong class="text-success" th:text="${q.correctAnswer}"></strong></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
