<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Global Leaderboard - E-Learning System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">🎓 E-Learning System</span>
            <a href="/" class="btn btn-outline-light btn-sm">🏠 Home</a>
        </div>
    </nav>

    <div class="container d-flex flex-column align-items-center flex-grow-1 my-5">
        <div class="card shadow-lg p-4 border-0 rounded-4 w-100" style="max-width: 700px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">🏆 Global Leaderboard</h2>
                <p class="text-muted">Top performers ranked by assessment scores.</p>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Rank</th>
                            <th>Student Name</th>
                            <th>Subject</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry, stat : ${leaderboard}">
                            <td class="fw-bold" th:text="${stat.count}">1</td>
                            <td class="fw-semibold text-start ps-4" th:text="${entry.name}">Mayank</td>
                            <td><span class="badge bg-info text-dark" th:text="${entry.subject}">Java</span></td>
                            <td><strong class="text-success" th:text="${entry.score + ' / ' + entry.total}">8 / 10</strong></td>
                        </tr>
                        <tr th:if="${leaderboard.isEmpty()}">
                            <td colspan="4" class="text-muted py-4">No records found yet. Be the first to take the quiz!</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">🚀 Take Assessment</a>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">E Learning System &copy; 2026 | MCA Major Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
