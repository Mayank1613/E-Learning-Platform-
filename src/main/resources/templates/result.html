<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assessment Result - E-Learning System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">🎓 E-Learning System</span>
            <a href="/" class="btn btn-outline-light btn-sm">🏠 Home</a>
        </div>
    </nav>

    <div class="container d-flex flex-column justify-content-center align-items-center flex-grow-1 my-5">
        <div class="card shadow-lg p-5 border-0 rounded-4 text-center" style="max-width: 600px; width: 100%;">
            
            <h2 class="text-success fw-bold mb-2">🎉 Assessment Completed!</h2>
            <p class="text-muted mb-4">Subject: <span class="fw-semibold text-dark" th:text="${subject}">Java</span></p>

            <!-- Score Display Box -->
            <div class="p-4 bg-white border rounded-3 shadow-sm mb-4">
                <h3 class="display-5 fw-bold text-primary mb-1">
                    <span th:text="${score}">0</span> / <span th:text="${total}">0</span>
                </h3>
                <p class="text-muted mb-3">Percentage: <strong th:text="${percentage + '%'}">0%</strong></p>
                <div>
                    <span class="badge bg-warning text-dark fs-6 px-3 py-2" th:text="${badge}">Scholar 🏆</span>
                </div>
            </div>

            <!-- Detailed Breakdown -->
            <div class="row text-start mb-4 g-2">
                <div class="col-6">
                    <div class="p-3 border bg-light rounded-3">
                        <span class="text-muted small d-block">Attempted</span>
                        <strong class="fs-5 text-success" th:text="${attempted}">0</strong>
                    </div>
                </div>
                <div class="col-6">
                    <div class="p-3 border bg-light rounded-3">
                        <span class="text-muted small d-block">Unattempted</span>
                        <strong class="fs-5 text-danger" th:text="${unattempted}">0</strong>
                    </div>
                </div>
            </div>

            <!-- Save Score Form -->
            <form action="#" th:action="@{/saveScore}" method="post" class="mb-3">
                <div class="input-group mb-2">
                    <input type="text" name="playerName" class="form-control" placeholder="Enter your full name..." required>
                    <button class="btn btn-dark fw-bold" type="submit">💾 Save to Leaderboard</button>
                </div>
            </form>

            <!-- Navigation Actions -->
            <div class="d-flex justify-content-between mt-3">
                <a href="/review" class="btn btn-outline-primary fw-semibold">🔍 View Detailed Review</a>
                <a href="/" class="btn btn-outline-secondary fw-semibold">🔄 Take Another Quiz</a>
            </div>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">E Learning System &copy; 2026 | MCA Major Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
